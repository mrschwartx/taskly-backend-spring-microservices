name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  taskly-build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service:
          - taskly-backend-service-discovery
          - taskly-backend-api-gateway
          - taskly-backend-user-service
          - taskly-backend-task-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - run: ./mvnw -B -ntp -DskipTests verify

  taskly-test:
    name: test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [taskly-build]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - taskly-backend-service-discovery
          - taskly-backend-api-gateway
          - taskly-backend-user-service
          - taskly-backend-task-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - run: ./mvnw -B -ntp verify

  taskly-docker:
    name: taskly docker stack
    runs-on: ubuntu-latest
    needs: [taskly-test]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: taskly-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start stack
        run: make docker/up
      - name: Check gateway
        run: curl -fsS http://localhost:8080/
      - name: Check service registry
        run: |
          curl -fsS -H 'Accept: application/json' http://localhost:8761/eureka/apps | grep -q USER-SERVICE
          curl -fsS -H 'Accept: application/json' http://localhost:8761/eureka/apps | grep -q TASK-SERVICE
      - name: Check seed
        run: make docker/seed
      - name: End to end smoke test
        run: make docker/smoke
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps -a
          for container in taskly-gateway taskly-user-service taskly-task-service taskly-discovery taskly-kafka; do
            echo "=== $container logs"
            docker logs $container 2>&1 | tail -n 80
          done
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
