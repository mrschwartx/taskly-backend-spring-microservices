spring:
  application:
    name: api-gateway
  config:
    import: optional:file:.env[.properties]
  reactor:
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            pool:
              type: fixed
              max-connections: ${GATEWAY_MAX_CONNECTIONS:200}
              acquire-timeout: 2000
              max-idle-time: 30s
    loadbalancer:
      cache:
        ttl: 5s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: ${APP_HOST:0.0.0.0}
  port: ${APP_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
    eureka-server-connect-timeout-seconds: 2
    eureka-server-read-timeout-seconds: 4
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: 2s
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    com.taskly: ${LOG_LEVEL:debug}
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "
  file:
    name: ${LOG_FILE:logs/api-gateway.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14

taskly:
  gateway:
    client-url: ${CLIENT_URL:http://localhost:3000}
    timeouts:
      connect: 1s
      response: 4s
      upload: 15s
    retry:
      retries: 2
      first-backoff: 100ms
      max-backoff: 500ms
    rate-limit:
      auth-replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH:5}
      auth-burst-capacity: ${AUTH_RATE_LIMIT_BURST:10}
    circuit-breaker:
      sliding-window-size: 20
      minimum-number-of-calls: 10
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
      time-limit: 20s
